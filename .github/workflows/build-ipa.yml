name: Build unsigned IPA

# Builds the app on a free GitHub-hosted Mac and uploads an UNSIGNED .ipa.
# Sideloadly (Windows) then signs it with a free Apple ID and installs it on the iPhone.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project GolfCamPrototype.xcodeproj \
            -scheme GolfCamPrototype \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GolfCamPrototype.app Payload/
          zip -qry GolfCamPrototype.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GolfCamPrototype-ipa
          path: GolfCamPrototype.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
